[project]
name = "ha-sec-smart"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11"]

[dependency-groups]
dev = [
  "jinja2>=3.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyyaml>=6.0",
]
ha = [
  "freezegun>=1.5",
  "homeassistant==2026.10.2",
  "pytest-homeassistant-custom-component==0.13.373",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
