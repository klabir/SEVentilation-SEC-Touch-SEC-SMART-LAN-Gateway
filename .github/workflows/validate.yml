name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install aiohttp jinja2 pytest pytest-asyncio pyyaml
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Run tests
        run: pytest -q
      - name: Validate JSON and YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          class BlueprintLoader(yaml.SafeLoader):
              pass

          BlueprintLoader.add_constructor(
              "!input", lambda loader, node: loader.construct_scalar(node)
          )

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path(".").rglob("*.yaml"):
              yaml.load(path.read_text(encoding="utf-8"), Loader=BlueprintLoader)
          PY

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
